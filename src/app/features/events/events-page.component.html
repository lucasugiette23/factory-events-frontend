<div class="events-page-container">
  <!-- Feedback Alert Messages -->
  @if (successMessage) {
    <div class="alert alert-success" role="status">
      <div class="alert-content">
        <svg class="alert-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <span class="alert-message">{{ successMessage }}</span>
      </div>
      <button
        type="button"
        class="alert-close"
        (click)="dismissAlert('success')"
        aria-label="Dismiss success message"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  }

  @if (errorMessage) {
    <div class="alert alert-danger" role="alert">
      <div class="alert-content">
        <svg class="alert-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span class="alert-message">{{ errorMessage }}</span>
      </div>
      <button
        type="button"
        class="alert-close"
        (click)="dismissAlert('error')"
        aria-label="Dismiss error message"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  }

  <!-- Section 1: Event Registration Form -->
  <section aria-labelledby="form-section-heading">
    <h2 id="form-section-heading" class="visually-hidden">Register Event</h2>
    <app-event-form
      [isSubmitting]="isSubmitting"
      (submitEvent)="onRegisterEvent($event)"
    />
  </section>

  <!-- Section 2: Events List -->
  <section aria-labelledby="list-section-heading">
    <h2 id="list-section-heading" class="visually-hidden">Factory Events Log</h2>
    <app-event-list
      [events]="events"
      [isLoading]="isLoadingEvents"
      [errorMessage]="eventsError"
      (refresh)="loadEvents()"
    />
  </section>
</div>
